<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Topic Classifier</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211d;
      --muted: #66736d;
      --green: #246b52;
      --green-dark: #164936;
      --paper: #f4f6f1;
      --line: #dce4dd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: radial-gradient(circle at 15% 10%, #e5f0e8 0, transparent 36%), var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(26px, 6vw, 52px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 24px 70px rgba(27, 55, 42, .10);
    }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--green);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(32px, 7vw, 48px); letter-spacing: -.045em; line-height: 1.06; }
    .intro { margin: 16px 0 30px; max-width: 52ch; color: var(--muted); line-height: 1.65; }
    form { display: flex; gap: 10px; }
    input {
      width: 100%; min-width: 0; padding: 15px 16px;
      border: 1px solid #cbd7ce; border-radius: 12px;
      color: var(--ink); background: white; font: inherit; outline: none;
    }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(36, 107, 82, .13); }
    button {
      flex: 0 0 auto; border: 0; border-radius: 12px; padding: 0 20px;
      background: var(--green); color: white; font: inherit; font-weight: 700; cursor: pointer;
    }
    button:hover { background: var(--green-dark); }
    button:disabled { opacity: .65; cursor: wait; }
    .status { min-height: 24px; margin: 12px 2px 0; color: var(--muted); font-size: 14px; }
    .result {
      display: none; margin-top: 26px; padding: 22px;
      border: 1px solid #d6e6dc; border-radius: 16px;
      background: #f2f8f3;
    }
    .result.show { display: block; }
    .result-label { margin: 0 0 7px; color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .category { margin: 0; font-size: clamp(25px, 5vw, 34px); letter-spacing: -.03em; }
    .confidence { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .page-title { margin: 14px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
    @media (max-width: 540px) {
      form { flex-direction: column; }
      button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Trained on 1 million samples · 24 categories</p>
    <h1>What’s this site about?</h1>
    <p class="intro">Enter a public webpage URL. The classifier reads the page and returns its highest-scoring topic.</p>

    <form id="form">
      <input id="url" name="url" type="url" placeholder="https://example.com/article" required autocomplete="url">
      <button id="submit" type="submit">Classify page</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="result" id="result" aria-live="polite">
      <p class="result-label">Highest scoring topic</p>
      <h2 class="category" id="category"></h2>
      <p class="confidence" id="confidence"></p>
      <p class="page-title" id="page-title"></p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#form");
    const input = document.querySelector("#url");
    const button = document.querySelector("#submit");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.classList.remove("show");
      status.textContent = "Fetching the page and running the classifier…";
      button.disabled = true;

      try {
        const response = await fetch("/api/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: input.value.trim() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Prediction failed.");

        document.querySelector("#category").textContent = data.category;
        document.querySelector("#confidence").textContent =
          `Model score: ${(data.probability * 100).toFixed(1)}%`;
        document.querySelector("#page-title").textContent = data.title || data.url;
        result.classList.add("show");
        status.textContent = "Classification complete.";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
